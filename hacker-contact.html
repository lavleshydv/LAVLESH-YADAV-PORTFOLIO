<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact - Full-stack Developer Portfolio">
    <title>Contact | DevPortfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hacker-style.css">
</head>
<body>
    <div class="dot-grid"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="hacker-contact.html" class="nav-icon active" aria-label="Contact">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/>
                </svg>
            </a>

            <div class="nav-pill">
                <a href="hacker-index.html" class="nav-link" data-page="home">
                    <span class="bracket">[</span>Gallery<span class="bracket">]</span>
                </a>
                <a href="hacker-about.html" class="nav-link" data-page="about">
                    <span class="bracket">[</span>About<span class="bracket">]</span>
                </a>
                <a href="hacker-contact.html" class="nav-link active" data-page="contact">
                    <span class="bracket">[</span>Contact<span class="bracket">]</span>
                </a>
                <a href="#help" class="nav-link" data-page="help">
                    <span class="bracket">[</span>Help<span class="bracket">]</span>
                </a>
            </div>

            <div class="profile-avatar">
                <div class="avatar-circle">LY</div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="contact-section">
            <div class="contact-container">
                <!-- Left: Form -->
                <div class="contact-left">
                    <h1 class="contact-title">
                        <span class="bracket">&lt;</span>Get In Touch<span class="bracket">&gt;</span>
                    </h1>

                    <form class="contact-form" id="contactForm">
                        <div class="form-group">
                            <label for="name" class="form-label">Name</label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="form-input" 
                                placeholder="Your name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="your@email.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea 
                                id="message" 
                                name="message" 
                                class="form-textarea" 
                                placeholder="Write Message"
                                rows="6"
                                required
                            ></textarea>
                        </div>

                        <div class="form-buttons">
                            <button type="submit" class="form-button submit-button">
                                <span class="bracket-left">&lt;</span> Send <span class="bracket-right">/&gt;</span>
                            </button>
                            <button type="reset" class="form-button cancel-button">
                                <span class="bracket-left">[</span> Reset <span class="bracket-right">]</span>
                            </button>
                        </div>

                        <div id="formStatus" class="form-status"></div>
                    </form>

                    <!-- Social Icons -->
                    <div class="social-section">
                        <p class="social-label">
                            <span class="bracket">[</span>Follow Me<span class="bracket">]</span>
                        </p>
                        <div class="social-icons">
                            <a href="https://github.com/lavleshydv" target="_blank" rel="noopener noreferrer" class="social-icon" title="GitHub" aria-label="GitHub">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                                </svg>
                            </a>
                            <a href="https://linkedin.com/in/lavlesh-yadav-3a4aa4340" target="_blank" rel="noopener noreferrer" class="social-icon" title="LinkedIn" aria-label="LinkedIn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
                                    <rect x="2" y="9" width="4" height="12"/>
                                    <circle cx="4" cy="4" r="2"/>
                                </svg>
                            </a>
                            <a href="mailto:umay81861@gmail.com" class="social-icon" title="Email" aria-label="Email">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                            </a>
                            <a href="#" class="social-icon" title="Twitter/X" aria-label="Twitter">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2s9 5 20 0a9.5 9.5 0 0 0-8.76-4.4"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right: Portrait -->
                <div class="contact-right">
                    <div class="contact-portrait">
                        <div class="portrait-placeholder large">
                            <svg width="200" height="300" viewBox="0 0 200 300" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="100" cy="70" r="50"/>
                                <path d="M50 140 Q50 110 100 110 Q150 110 150 140 L150 250 Q150 280 120 280 L80 280 Q50 280 50 250 Z"/>
                                <line x1="75" y1="160" x2="75" y2="180"/>
                                <line x1="125" y1="160" x2="125" y2="180"/>
                                <path d="M85 220 Q100 235 115 220"/>
                            </svg>
                            <p class="placeholder-text">Developer Portrait</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer-text">
            <span class="bracket">&lt;/&gt;</span> 
            Built with passion & code | © 2026 Lavlesh Yadav
            <span class="bracket">&lt;/&gt;</span>
        </p>
    </footer>

    <script src="hacker-script.js"></script>
</body>
</html>
